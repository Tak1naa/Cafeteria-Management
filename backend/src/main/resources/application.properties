# ==========================================
# Actuator 监控配置（如果需要）
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# 业务配置
# ==========================================
# 限流配置（令牌桶容量：1000 请求/秒）
business.rate-limit.capacity=1000
business.rate-limit.refill-rate=100

# AI 决策配置
business.ai.enabled=true
business.ai.decision-timeout=1000

# ==========================================
# 开发工具配置
# ==========================================
# 热部署（如果使用 spring-boot-devtools）
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# 关闭 Thymeleaf 缓存（如果使用）
spring.thymeleaf.cache=false