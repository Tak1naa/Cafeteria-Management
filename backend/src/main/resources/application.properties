# ==========================================
# 服务器配置
# ==========================================
server.port=8081
server.servlet.context-path=/
# 限制请求体大小，防止大 JSON 攻击（默认 2MB）
server.tomcat.max-http-form-post-size=2MB

# ==========================================
# 日志配置
# ==========================================
# 日志级别：root 为 INFO，自己的包为 DEBUG
logging.level.root=INFO
logging.level.com.canteen=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# 控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# 默认使用 dev 配置（内置 H2，无需安装 MySQL）
# 使用 MySQL 时启动：-Dspring-boot.run.profiles=mysql
spring.profiles.active=mysql

# ==========================================
# JPA / Hibernate（各 profile 共用）
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

# ==========================================
# Jackson 配置（JSON 序列化）
# ==========================================
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# ==========================================
# 文件上传配置（如果需要）
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# 联调开关（前端 / C++ 可不依赖 Redis、RabbitMQ）
# ==========================================
integration.redis.enabled=true
integration.rabbit.enabled=true

# ==========================================
# Redis 配置
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5

# ==========================================
# RabbitMQ 配置
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=5000ms

# ==========================================
# Actuator 监控配置（如果需要）
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# 安全配置
# ==========================================
# C++ 仿真引擎调用 /api/** 时需要携带此 Header
# 启动时可通过环境变量覆盖：export SECURITY_API_KEY=your-key
security.api-key=changeme-dev-key

# ==========================================
# 业务配置
# ==========================================
# 限流配置（令牌桶容量：1000 请求/秒）
business.rate-limit.capacity=1000
business.rate-limit.refill-rate=100

# AI 决策配置
business.ai.enabled=true
business.ai.decision-timeout=1000

# ==========================================
# DeepSeek API 配置
# 通过环境变量设置 API Key，不要在代码中硬编码：
#   export DEEPSEEK_API_KEY=sk-your-key
# ==========================================
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.base-url=https://api.deepseek.com
deepseek.api.model=deepseek-chat
deepseek.api.timeout=10000
deepseek.api.enabled=${DEEPSEEK_API_ENABLED:false}

# ==========================================
# 开发工具配置
# ==========================================
# 热部署（如果使用 spring-boot-devtools）
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# ==========================================
# C++ 仿真引擎自动拉起
# ==========================================
# 二进制路径（相对于 backend/ 目录，即 ../build/cafeteria_sim）
simulation.cpp.binary=../build/cafeteria_sim
simulation.cpp.config=../config/default_config.json

# 关闭 Thymeleaf 缓存（如果使用）
spring.thymeleaf.cache=false