# ==========================================
# 服务器配置
# ==========================================
server.port=8081
server.servlet.context-path=/

# ==========================================
# 日志配置
# ==========================================
# 日志级别：root 为 INFO，自己的包为 DEBUG
logging.level.root=INFO
logging.level.com.canteen=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# 控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ==========================================
# 数据库配置（MySQL）
# ==========================================
# 数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/canteen_sim?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Eat@3390
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# JPA / Hibernate 配置
# ==========================================
# 自动更新表结构（开发环境用 update，生产环境用 validate）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# 关闭 JPA 事务感知（避免警告）
spring.jpa.open-in-view=false

# ==========================================
# Jackson 配置（JSON 序列化）
# ==========================================
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# ==========================================
# 文件上传配置（如果需要）
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

