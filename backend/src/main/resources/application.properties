# ==========================================
# 服务器配置
# ==========================================
server.port=8081
server.servlet.context-path=/

# ==========================================
# 日志配置
# ==========================================
# 日志级别：root 为 INFO，自己的包为 DEBUG
logging.level.root=INFO
logging.level.com.canteen=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# 控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# 默认使用 dev 配置（内置 H2，无需安装 MySQL）
# 使用 MySQL 时启动：-Dspring-boot.run.profiles=mysql
spring.profiles.active=dev

# ==========================================
# JPA / Hibernate（各 profile 共用）
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

# ==========================================
# Jackson 配置（JSON 序列化）
# ==========================================
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# ==========================================
# 文件上传配置（如果需要）
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# 联调开关（前端 / C++ 可不依赖 Redis、RabbitMQ）
# ==========================================
integration.redis.enabled=false
integration.rabbit.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

