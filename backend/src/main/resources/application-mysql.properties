# MySQL 环境（本地已创建库 canteen_sim）
# 密码通过环境变量 DB_PASSWORD 传入，避免硬编码
# 启动方式：DB_PASSWORD=yourpass ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/canteen_sim?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
